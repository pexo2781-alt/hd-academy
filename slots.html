<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HDA — Select Profile</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="container">
    <div class="text-center mt-2">
      <h1 style="letter-spacing:0.2em; font-size:1.4rem; color:var(--anhs-grey);">SELECT YOUR PROFILE</h1>
      <p class="subtitle">Three files. Three lives.</p>
    </div>

    <div id="slotGrid" class="slot-grid"></div>

    <div class="text-center mt-2">
      <a href="index.html" class="btn btn-secondary">← Back to Title</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/state.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/slot-manager.js"></script>
  <script>
    function renderSlots() {
      const slots = SlotManager.loadAll();
      const grid = document.getElementById("slotGrid");
      grid.innerHTML = [1, 2, 3].map(n => {
        const s = slots[n];
        if (s.exists) {
          return `
            <div class="slot-card">
              <div>
                <div class="slot-label">Slot ${n}</div>
                <div class="slot-portrait" style="background:${s.portrait.color}">${s.portrait.emoji}</div>
                <div class="slot-name">${s.name}</div>
                <div class="slot-meta">Class ${s.classRank} · ${s.classPoints} CP</div>
                <div class="slot-meta">Day ${s.day}</div>
                ${s.legacy ? '<span class="slot-legacy">Legacy</span>' : ''}
              </div>
              <div class="slot-actions">
                <button class="btn" onclick="continueSlot(${n})">Continue</button>
                <button class="slot-delete" onclick="deleteSlot(${n})">Delete</button>
              </div>
            </div>`;
        } else {
          return `
            <div class="slot-card empty" onclick="location.href='new-game.html?slot=${n}'">
              <div class="slot-label">Slot ${n}</div>
              <div class="slot-empty-label">Empty</div>
              <button class="btn">New Game</button>
            </div>`;
        }
      }).join("");
    }

    function continueSlot(n) {
      SlotManager.activate(n);
      location.href = "campus.html";
    }

    function deleteSlot(n) {
      if (!confirm("Delete this profile? This cannot be undone.")) return;
      SlotManager.deleteSlot(n);
      renderSlots();
    }

    renderSlots();
  </script>
</body>
</html>
