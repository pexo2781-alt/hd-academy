<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subject 001 · lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --accent: #ffffff;
      --accent-muted: rgba(255, 255, 255, 0.6);
      --accent-dim: rgba(255, 255, 255, 0.1);
      --bg: #000000;
      --surface: #0a0a0a;
      --font-main: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-accent: 'Inter', system-ui, sans-serif;
      --transition: 0.3s cubic-bezier(0.2, 0.9, 0.4, 1);
    }

    body {
      background: var(--bg);
      color: var(--accent);
      font-family: var(--font-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: none; /* hide default cursor since we have the orb */
      transition: background 0.4s ease;
    }

    /* ----- BACKGROUND PATTERN ----- */
    .lab-bg-pattern {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      /* Dot grid + radial vignette, all driven by accent */
      background-image:
        radial-gradient(circle at 20% 30%, var(--accent-dim) 0%, transparent 35%),
        radial-gradient(circle at 80% 70%, var(--accent-dim) 0%, transparent 40%),
        radial-gradient(var(--accent-dim) 1px, transparent 1.2px),
        radial-gradient(var(--accent-dim) 1px, transparent 1.2px);
      background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
      background-position: 0 0, 0 0, 0 0, 16px 16px;
      opacity: 0.9;
      transition: background-image 0.4s ease;
    }

    /* Faint scanline / noise layer for texture */
    .lab-bg-pattern::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(255, 255, 255, 0.015) 0px,
        rgba(255, 255, 255, 0.015) 1px,
        transparent 1px,
        transparent 4px
      );
      pointer-events: none;
    }

    /* Soft radial vignette in accent, centered */
    .lab-bg-vignette {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 50%, transparent 0%, rgba(0, 0, 0, 0.6) 80%);
    }

    /* ----- MOUSE ORB + TRAIL ----- */
    .lab-orb {
      position: fixed;
      top: 0;
      left: 0;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
      box-shadow:
        0 0 15px var(--accent),
        0 0 30px var(--accent),
        0 0 60px var(--accent);
      opacity: 0.95;
      mix-blend-mode: screen;
      transition: background 0.3s ease, box-shadow 0.3s ease;
      will-change: transform;
    }

    /* Small solid core inside the orb */
    .lab-orb::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      transform: translate(-50%, -50%);
      box-shadow: 0 0 8px var(--accent);
    }

    /* Trail particle template – created via JS */
    .lab-trail {
      position: fixed;
      top: 0;
      left: 0;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
      box-shadow: 0 0 10px var(--accent);
      mix-blend-mode: screen;
      will-change: transform, opacity;
    }

    /* ----- LAB CONTAINER ----- */
    .lab {
      width: 100%;
      max-width: 1400px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      position: relative;
      z-index: 1;
    }

    /* ----- LANDING VIEW ----- */
    .lab-landing {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      transition: opacity 0.5s ease, transform 0.5s ease;
      opacity: 1;
      transform: scale(1);
    }

    .lab-landing.hidden {
      opacity: 0;
      transform: scale(0.95);
      pointer-events: none;
      display: none;
    }

    .lab-title {
      font-family: var(--font-accent);
      font-size: clamp(3rem, 12vw, 7rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      color: var(--accent);
      text-shadow: 0 0 30px var(--accent), 0 0 60px var(--accent-dim);
      animation: titlePulse 4s infinite alternate ease-in-out;
      margin-bottom: 0.5rem;
      transition: color var(--transition), text-shadow var(--transition);
    }

    @keyframes titlePulse {
      0% { text-shadow: 0 0 20px var(--accent), 0 0 40px var(--accent-dim); }
      100% { text-shadow: 0 0 40px var(--accent), 0 0 80px var(--accent-muted); }
    }

    .lab-quote {
      font-size: clamp(0.9rem, 2.5vw, 1.4rem);
      font-weight: 400;
      color: var(--accent-muted);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 3rem;
      opacity: 0;
      animation: fadeSlideUp 1.2s 0.3s forwards cubic-bezier(0.2, 0.9, 0.4, 1);
      transition: color var(--transition);
      max-width: 80%;
      border-left: 2px solid var(--accent-dim);
      padding-left: 1.5rem;
      text-align: left;
    }

    @keyframes fadeSlideUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .lab-start-btn {
      background: transparent;
      border: 1.5px solid var(--accent);
      color: var(--accent);
      font-family: var(--font-accent);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      padding: 1rem 3.5rem;
      cursor: none;
      position: relative;
      transition: all var(--transition);
      border-radius: 0;
      overflow: hidden;
    }

    .lab-start-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: var(--accent);
      transition: left 0.4s cubic-bezier(0.2, 0.9, 0.4, 1);
      z-index: -1;
    }

    .lab-start-btn:hover {
      color: #000;
      box-shadow: 0 0 30px var(--accent), 0 0 60px var(--accent-dim);
    }

    .lab-start-btn:hover::before { left: 0; }
    .lab-start-btn:active { transform: scale(0.97); }

    .lab-bottom-line {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 1px;
      background: var(--accent-dim);
      transition: background var(--transition);
    }

    /* ----- SETTINGS VIEW ----- */
    .lab-settings {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 700px;
      padding: 2rem;
      background: rgba(10, 10, 10, 0.85);
      border: 1px solid var(--accent-dim);
      box-shadow: 0 0 60px var(--accent-dim);
      backdrop-filter: blur(10px);
      transition: border-color var(--transition), box-shadow var(--transition);
      animation: settingsFadeIn 0.5s cubic-bezier(0.2, 0.9, 0.4, 1);
    }

    @keyframes settingsFadeIn {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .lab-settings-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2.5rem;
    }

    .lab-settings-header h2 {
      font-family: var(--font-accent);
      font-weight: 500;
      font-size: 1.5rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      transition: color var(--transition);
    }

    .lab-close-btn {
      background: none;
      border: 1px solid var(--accent-dim);
      color: var(--accent-muted);
      font-size: 1.2rem;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: none;
      transition: all var(--transition);
      border-radius: 0;
      font-family: var(--font-main);
    }

    .lab-close-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-dim);
    }

    .settings-group {
      width: 100%;
      margin-bottom: 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .settings-group label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--accent-muted);
      font-weight: 500;
      transition: color var(--transition);
    }

    .settings-group input,
    .settings-group select {
      background: transparent;
      border: 1px solid var(--accent-dim);
      padding: 0.9rem 1rem;
      font-family: var(--font-main);
      font-size: 1rem;
      color: var(--accent);
      outline: none;
      transition: all var(--transition);
      border-radius: 0;
      width: 100%;
      cursor: none;
    }

    .settings-group input:focus,
    .settings-group select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 15px var(--accent-dim);
    }

    .settings-group input[type="color"] {
      padding: 0.2rem;
      height: 50px;
      cursor: none;
    }

    .settings-group select option {
      background: var(--bg);
      color: var(--accent);
    }

    .settings-actions {
      display: flex;
      gap: 1rem;
      width: 100%;
      margin-top: 1rem;
    }

    .lab-btn {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-family: var(--font-accent);
      font-weight: 500;
      font-size: 0.9rem;
      padding: 0.9rem 1.5rem;
      cursor: none;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: all var(--transition);
      flex: 1;
      border-radius: 0;
    }

    .lab-btn:hover {
      background: var(--accent);
      color: #000;
      box-shadow: 0 0 20px var(--accent);
    }

    .lab-btn.secondary {
      border-color: var(--accent-muted);
      color: var(--accent-muted);
    }

    .lab-btn.secondary:hover {
      background: var(--accent-muted);
      color: #000;
      border-color: var(--accent-muted);
      box-shadow: 0 0 20px var(--accent-dim);
    }

    .lab-footer {
      position: absolute;
      bottom: 1.5rem;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      color: var(--accent-dim);
      text-transform: uppercase;
      transition: color var(--transition);
      z-index: 2;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <!-- Background pattern layers -->
  <div class="lab-bg-pattern"></div>
  <div class="lab-bg-vignette"></div>

  <!-- Glowing orb that follows the mouse -->
  <div class="lab-orb" id="labOrb"></div>

  <div class="lab">
    <!-- LANDING -->
    <div class="lab-landing" id="labLanding">
      <h1 class="lab-title" id="labTitle">SUBJECT 001</h1>
      <p class="lab-quote" id="labQuote">“The self is the only laboratory that matters.”</p>
      <button class="lab-start-btn" id="startBtn">Begin</button>
      <div class="lab-bottom-line"></div>
    </div>

    <!-- SETTINGS -->
    <div class="lab-settings" id="labSettings">
      <div class="lab-settings-header">
        <h2>LAB CONFIG</h2>
        <button class="lab-close-btn" id="closeSettingsBtn">✕</button>
      </div>

      <div class="settings-group">
        <label for="labNameInput">Lab name</label>
        <input type="text" id="labNameInput" value="SUBJECT 001" placeholder="Enter lab title">
      </div>

      <div class="settings-group">
        <label for="accentColorInput">Accent color</label>
        <input type="color" id="accentColorInput" value="#ffffff">
      </div>

      <div class="settings-group">
        <label for="accentFontSelect">Accent font</label>
        <select id="accentFontSelect">
          <option value="'Inter', system-ui, sans-serif">Inter (default)</option>
          <option value="'Courier New', monospace">Courier New</option>
          <option value="'Arial Black', 'Arial Bold', sans-serif">Arial Black</option>
          <option value="'Georgia', serif">Georgia</option>
          <option value="'Times New Roman', serif">Times New Roman</option>
          <option value="'Trebuchet MS', sans-serif">Trebuchet MS</option>
          <option value="'Verdana', sans-serif">Verdana</option>
          <option value="'Impact', sans-serif">Impact</option>
        </select>
      </div>

      <div class="settings-group">
        <label for="quoteInput">Landing quote</label>
        <input type="text" id="quoteInput" value="“The self is the only laboratory that matters.”" placeholder="Enter a quote">
      </div>

      <div class="settings-actions">
        <button class="lab-btn" id="applySettingsBtn">Apply</button>
        <button class="lab-btn secondary" id="resetSettingsBtn">Reset</button>
      </div>
    </div>

    <div class="lab-footer">LAB · SUBJECT 001 · v0.1</div>
  </div>

  <script>
    (function() {
      // ---------- ORB + TRAIL ----------
      const orb = document.getElementById('labOrb');
      const body = document.body;

      // Current target position
      let targetX = window.innerWidth / 2;
      let targetY = window.innerHeight / 2;
      // Orb current position (lerped)
      let orbX = targetX;
      let orbY = targetY;

      // Trail particles
      const trailParticles = [];
      const MAX_TRAIL = 24;
      const TRAIL_LIFE = 28; // frames

      // Spawn a trail particle roughly every N frames when moving
      let spawnCounter = 0;
      const SPAWN_INTERVAL = 1;

      function createTrailParticle(x, y) {
        const el = document.createElement('div');
        el.className = 'lab-trail';
        // randomize size slightly for organic feel
        const size = 6 + Math.random() * 10;
        el.style.width = size + 'px';
        el.style.height = size + 'px';
        el.style.transform = `translate(${x}px, ${y}px) translate(-50%, -50%)`;
        document.body.appendChild(el);
        return {
          el,
          x,
          y,
          life: TRAIL_LIFE,
          maxLife: TRAIL_LIFE,
          size
        };
      }

      function updateTrail() {
        for (let i = trailParticles.length - 1; i >= 0; i--) {
          const p = trailParticles[i];
          p.life -= 1;
          const t = p.life / p.maxLife;
          if (p.life <= 0) {
            p.el.remove();
            trailParticles.splice(i, 1);
            continue;
          }
          // Fade & shrink
          p.el.style.opacity = (t * 0.7).toFixed(3);
          const scale = 0.3 + t * 0.7;
          // slight drift upward for magical feel
          p.y -= 0.15;
          p.el.style.transform = `translate(${p.x}px, ${p.y}px) translate(-50%, -50%) scale(${scale})`;
        }
      }

      // Main animation loop
      function animate() {
        // Lerp orb toward mouse
        const lerpFactor = 0.22;
        orbX += (targetX - orbX) * lerpFactor;
        orbY += (targetY - orbY) * lerpFactor;

        // Get previous orb position for trail spawn
        const prevX = orbX;
        const prevY = orbY;

        orb.style.transform = `translate(${orbX}px, ${orbY}px) translate(-50%, -50%)`;

        // Spawn trail based on movement distance (so it doesn't spawn when stationary)
        const dx = targetX - orbX;
        const dy = targetY - orbY;
        const speed = Math.sqrt(dx * dx + dy * dy);

        if (speed > 2) {
          spawnCounter++;
          if (spawnCounter >= SPAWN_INTERVAL) {
            spawnCounter = 0;
            // Spawn slightly behind the orb with jitter for wand effect
            const jitterX = (Math.random() - 0.5) * 8;
            const jitterY = (Math.random() - 0.5) * 8;
            const particle = createTrailParticle(prevX + jitterX, prevY + jitterY);
            trailParticles.push(particle);

            if (trailParticles.length > MAX_TRAIL) {
              const old = trailParticles.shift();
              old.el.remove();
            }
          }
        }

        updateTrail();
        requestAnimationFrame(animate);
      }

      // Mouse move listener
      window.addEventListener('mousemove', (e) => {
        targetX = e.clientX;
        targetY = e.clientY;
      });

      // Touch support for mobile
      window.addEventListener('touchmove', (e) => {
        if (e.touches.length > 0) {
          targetX = e.touches[0].clientX;
          targetY = e.touches[0].clientY;
        }
      }, { passive: true });

      // Handle window resize
      window.addEventListener('resize', () => {
        // Keep orb in bounds
        targetX = Math.min(targetX, window.innerWidth);
        targetY = Math.min(targetY, window.innerHeight);
      });

      // Start animation loop
      animate();

      // ---------- CORE APP LOGIC (unchanged) ----------
      const landing = document.getElementById('labLanding');
      const settingsPanel = document.getElementById('labSettings');
      const startBtn = document.getElementById('startBtn');
      const closeSettingsBtn = document.getElementById('closeSettingsBtn');
      const applySettingsBtn = document.getElementById('applySettingsBtn');
      const resetSettingsBtn = document.getElementById('resetSettingsBtn');

      const labTitle = document.getElementById('labTitle');
      const labQuote = document.getElementById('labQuote');
      const labNameInput = document.getElementById('labNameInput');
      const accentColorInput = document.getElementById('accentColorInput');
      const accentFontSelect = document.getElementById('accentFontSelect');
      const quoteInput = document.getElementById('quoteInput');

      function setAccent(color) {
        document.documentElement.style.setProperty('--accent', color);
        const rgb = hexToRgb(color);
        if (rgb) {
          document.documentElement.style.setProperty('--accent-muted', `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.6)`);
          document.documentElement.style.setProperty('--accent-dim', `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.1)`);
        }
      }

      function hexToRgb(hex) {
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? {
          r: parseInt(result[1], 16),
          g: parseInt(result[2], 16),
          b: parseInt(result[3], 16)
        } : null;
      }

      function setAccentFont(fontFamily) {
        document.documentElement.style.setProperty('--font-accent', fontFamily);
      }

      function setLabName(name) {
        labTitle.textContent = name.toUpperCase();
        labNameInput.value = name;
        const footer = document.querySelector('.lab-footer');
        if (footer) {
          footer.textContent = `LAB · ${name.toUpperCase()} · v0.1`;
        }
      }

      function setQuote(quote) {
        labQuote.textContent = quote;
        quoteInput.value = quote;
      }

      const STORAGE_KEY = 'lab_config_v1';

      function saveConfigToLocal(config) {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(config)); } catch (e) {}
      }

      function loadConfigFromLocal() {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          return stored ? JSON.parse(stored) : null;
        } catch (e) { return null; }
      }

      function applyConfig(config) {
        if (!config) return;
        if (config.labName) setLabName(config.labName);
        if (config.accentColor) {
          setAccent(config.accentColor);
          accentColorInput.value = config.accentColor;
        }
        if (config.accentFont) {
          setAccentFont(config.accentFont);
          accentFontSelect.value = config.accentFont;
        }
        if (config.quote) setQuote(config.quote);
      }

      const defaultConfig = {
        labName: 'SUBJECT 001',
        accentColor: '#ffffff',
        accentFont: "'Inter', system-ui, sans-serif",
        quote: '“The self is the only laboratory that matters.”'
      };

      (function init() {
        const stored = loadConfigFromLocal();
        if (stored) {
          applyConfig(stored);
        } else {
          setLabName(defaultConfig.labName);
          setAccent(defaultConfig.accentColor);
          setAccentFont(defaultConfig.accentFont);
          setQuote(defaultConfig.quote);
          accentColorInput.value = defaultConfig.accentColor;
          accentFontSelect.value = defaultConfig.accentFont;
          saveConfigToLocal(defaultConfig);
        }
        labTitle.textContent = labTitle.textContent.toUpperCase();
      })();

      startBtn.addEventListener('click', () => {
        landing.classList.add('hidden');
        settingsPanel.style.display = 'flex';
      });

      closeSettingsBtn.addEventListener('click', () => {
        settingsPanel.style.display = 'none';
        landing.classList.remove('hidden');
      });

      applySettingsBtn.addEventListener('click', () => {
        const newName = labNameInput.value.trim() || 'LAB';
        const newColor = accentColorInput.value;
        const newFont = accentFontSelect.value;
        const newQuote = quoteInput.value.trim() || '“The self is the only laboratory that matters.”';

        setLabName(newName);
        setAccent(newColor);
        setAccentFont(newFont);
        setQuote(newQuote);

        saveConfigToLocal({
          labName: newName,
          accentColor: newColor,
          accentFont: newFont,
          quote: newQuote
        });

        settingsPanel.style.display = 'none';
        landing.classList.remove('hidden');
      });

      resetSettingsBtn.addEventListener('click', () => {
        labNameInput.value = defaultConfig.labName;
        accentColorInput.value = defaultConfig.accentColor;
        accentFontSelect.value = defaultConfig.accentFont;
        quoteInput.value = defaultConfig.quote;

        setLabName(defaultConfig.labName);
        setAccent(defaultConfig.accentColor);
        setAccentFont(defaultConfig.accentFont);
        setQuote(defaultConfig.quote);

        saveConfigToLocal(defaultConfig);
      });

      console.log('Lab ready — Subject 001');
    })();
  </script>
</body>
</html>
