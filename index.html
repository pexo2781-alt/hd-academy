<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subject 001 · lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --accent: #ffffff;
      --accent-rgb: 255, 255, 255;
      --accent-muted: rgba(var(--accent-rgb), 0.6);
      --accent-dim: rgba(var(--accent-rgb), 0.1);
      --accent-faint: rgba(var(--accent-rgb), 0.04);
      --bg: #000000;
      --surface: #0a0a0a;
      --text-primary: var(--accent);
      --text-secondary: rgba(255, 255, 255, 0.5);
      --font-main: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-accent: 'Inter', system-ui, sans-serif;
      --transition: 0.3s cubic-bezier(0.2, 0.9, 0.4, 1);
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: var(--accent);
      font-family: var(--font-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.4s ease;
      position: relative;
    }

    /* ---------- BACKGROUND LAYERS ---------- */
    /* 1. Base grid — perspective-free fine grid */
    .bg-grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(to right, var(--accent-faint) 1px, transparent 1px),
        linear-gradient(to bottom, var(--accent-faint) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse at center, rgba(0,0,0,1) 0%, rgba(0,0,0,0.6) 50%, transparent 90%);
      -webkit-mask-image: radial-gradient(ellipse at center, rgba(0,0,0,1) 0%, rgba(0,0,0,0.6) 50%, transparent 90%);
      animation: gridDrift 40s linear infinite;
      transition: background-image var(--transition);
    }

    @keyframes gridDrift {
      0%   { background-position: 0 0, 0 0; }
      100% { background-position: 48px 48px, 48px 48px; }
    }

    /* 2. Coarse accent grid — bigger squares, slower, adds depth */
    .bg-grid-coarse {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(to right, var(--accent-dim) 1px, transparent 1px),
        linear-gradient(to bottom, var(--accent-dim) 1px, transparent 1px);
      background-size: 192px 192px;
      mask-image: radial-gradient(circle at center, black 10%, transparent 85%);
      -webkit-mask-image: radial-gradient(circle at center, black 10%, transparent 85%);
      animation: gridDriftCoarse 60s linear infinite;
      transition: background-image var(--transition);
    }

    @keyframes gridDriftCoarse {
      0%   { background-position: 0 0, 0 0; }
      100% { background-position: -192px -192px, -192px -192px; }
    }

    /* 3. Central pulsing glow behind the title */
    .bg-glow {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 900px;
      height: 900px;
      transform: translate(-50%, -50%);
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(
        circle,
        rgba(var(--accent-rgb), 0.08) 0%,
        rgba(var(--accent-rgb), 0.03) 30%,
        transparent 65%
      );
      animation: glowPulse 6s ease-in-out infinite alternate;
      transition: background var(--transition);
    }

    @keyframes glowPulse {
      0%   { opacity: 0.5; transform: translate(-50%, -50%) scale(0.9); }
      100% { opacity: 1;   transform: translate(-50%, -50%) scale(1.1); }
    }

    /* 4. Vertical scanlines that slowly slide — CRT / lab feel */
    .bg-scanlines {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 2px,
        rgba(var(--accent-rgb), 0.012) 3px,
        transparent 4px
      );
      animation: scanShift 12s linear infinite;
      opacity: 0.9;
      transition: background-image var(--transition);
    }

    @keyframes scanShift {
      0%   { background-position: 0 0; }
      100% { background-position: 0 40px; }
    }

    /* 5. Vignette to focus the center */
    .bg-vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(
        ellipse at center,
        transparent 0%,
        transparent 40%,
        rgba(0, 0, 0, 0.55) 85%,
        rgba(0, 0, 0, 0.85) 100%
      );
    }

    /* 6. Subtle noise grain (SVG data-uri) for texture */
    .bg-noise {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0.035;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    }

    /* ---------- LAB CONTAINER ---------- */
    .lab {
      width: 100%;
      max-width: 1400px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      position: relative;
      z-index: 2;
    }

    /* ---------- LANDING ---------- */
    .lab-landing {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      transition: opacity 0.5s ease, transform 0.5s ease;
      opacity: 1;
      transform: scale(1);
    }

    .lab-landing.hidden {
      opacity: 0;
      transform: scale(0.95);
      pointer-events: none;
      display: none;
    }

    .lab-title {
      font-family: var(--font-accent);
      font-size: clamp(3rem, 12vw, 7rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      color: var(--accent);
      text-shadow: 0 0 30px var(--accent), 0 0 60px rgba(var(--accent-rgb), 0.2);
      animation: titlePulse 4s infinite alternate ease-in-out;
      margin-bottom: 0.5rem;
      transition: color var(--transition), text-shadow var(--transition);
    }

    @keyframes titlePulse {
      0%   { text-shadow: 0 0 20px var(--accent), 0 0 40px rgba(var(--accent-rgb), 0.1); }
      100% { text-shadow: 0 0 40px var(--accent), 0 0 80px rgba(var(--accent-rgb), 0.4); }
    }

    .lab-quote {
      font-size: clamp(0.9rem, 2.5vw, 1.4rem);
      font-weight: 400;
      color: var(--accent-muted);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 3rem;
      opacity: 0;
      animation: fadeSlideUp 1.2s 0.3s forwards cubic-bezier(0.2, 0.9, 0.4, 1);
      transition: color var(--transition);
      max-width: 80%;
      border-left: 2px solid var(--accent-dim);
      padding-left: 1.5rem;
      text-align: left;
    }

    @keyframes fadeSlideUp {
      0%   { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .lab-start-btn {
      background: transparent;
      border: 1.5px solid var(--accent);
      color: var(--accent);
      font-family: var(--font-accent);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      padding: 1rem 3.5rem;
      cursor: pointer;
      position: relative;
      transition: all var(--transition);
      border-radius: 0;
      overflow: hidden;
      z-index: 0;
    }

    .lab-start-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: var(--accent);
      transition: left 0.4s cubic-bezier(0.2, 0.9, 0.4, 1);
      z-index: -1;
    }

    .lab-start-btn:hover {
      color: #000;
      box-shadow: 0 0 30px var(--accent), 0 0 60px rgba(var(--accent-rgb), 0.3);
    }

    .lab-start-btn:hover::before { left: 0; }
    .lab-start-btn:active { transform: scale(0.97); }

    .lab-bottom-line {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 1px;
      background: var(--accent-dim);
      transition: background var(--transition);
    }

    /* ---------- SETTINGS ---------- */
    .lab-settings {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 700px;
      padding: 2rem;
      background: rgba(10, 10, 10, 0.85);
      border: 1px solid var(--accent-dim);
      box-shadow: 0 0 60px rgba(var(--accent-rgb), 0.05);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: border-color var(--transition), box-shadow var(--transition);
      animation: settingsFadeIn 0.5s cubic-bezier(0.2, 0.9, 0.4, 1);
    }

    @keyframes settingsFadeIn {
      0%   { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .lab-settings-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2.5rem;
    }

    .lab-settings-header h2 {
      font-family: var(--font-accent);
      font-weight: 500;
      font-size: 1.5rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      transition: color var(--transition);
    }

    .lab-close-btn {
      background: none;
      border: 1px solid var(--accent-dim);
      color: var(--accent-muted);
      font-size: 1.2rem;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition);
      border-radius: 0;
      font-family: var(--font-main);
    }

    .lab-close-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-dim);
    }

    .settings-group {
      width: 100%;
      margin-bottom: 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .settings-group label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--accent-muted);
      font-weight: 500;
      transition: color var(--transition);
    }

    .settings-group input,
    .settings-group select {
      background: transparent;
      border: 1px solid var(--accent-dim);
      padding: 0.9rem 1rem;
      font-family: var(--font-main);
      font-size: 1rem;
      color: var(--accent);
      outline: none;
      transition: all var(--transition);
      border-radius: 0;
      width: 100%;
    }

    .settings-group input:focus,
    .settings-group select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 15px rgba(var(--accent-rgb), 0.1);
    }

    .settings-group input[type="color"] {
      padding: 0.2rem;
      height: 50px;
      cursor: pointer;
    }

    .settings-group select option {
      background: var(--bg);
      color: var(--accent);
    }

    .settings-actions {
      display: flex;
      gap: 1rem;
      width: 100%;
      margin-top: 1rem;
    }

    .lab-btn {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-family: var(--font-accent);
      font-weight: 500;
      font-size: 0.9rem;
      padding: 0.9rem 1.5rem;
      cursor: pointer;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: all var(--transition);
      flex: 1;
      border-radius: 0;
    }

    .lab-btn:hover {
      background: var(--accent);
      color: #000;
      box-shadow: 0 0 20px var(--accent);
    }

    .lab-btn.secondary {
      border-color: var(--accent-muted);
      color: var(--accent-muted);
    }

    .lab-btn.secondary:hover {
      background: var(--accent-muted);
      color: #000;
      border-color: var(--accent-muted);
      box-shadow: 0 0 20px rgba(var(--accent-rgb), 0.2);
    }

    .hidden { display: none !important; }

    .lab-footer {
      position: absolute;
      bottom: 1.5rem;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      color: var(--accent-dim);
      text-transform: uppercase;
      transition: color var(--transition);
      z-index: 2;
    }
  </style>
</head>
<body>
  <!-- BACKGROUND LAYERS -->
  <div class="bg-grid"></div>
  <div class="bg-grid-coarse"></div>
  <div class="bg-glow"></div>
  <div class="bg-scanlines"></div>
  <div class="bg-vignette"></div>
  <div class="bg-noise"></div>

  <div class="lab">
    <!-- LANDING SECTION -->
    <div class="lab-landing" id="labLanding">
      <h1 class="lab-title" id="labTitle">SUBJECT 001</h1>
      <p class="lab-quote" id="labQuote">“The self is the only laboratory that matters.”</p>
      <button class="lab-start-btn" id="startBtn">Begin</button>
      <div class="lab-bottom-line"></div>
    </div>

    <!-- SETTINGS SECTION -->
    <div class="lab-settings" id="labSettings">
      <div class="lab-settings-header">
        <h2>LAB CONFIG</h2>
        <button class="lab-close-btn" id="closeSettingsBtn">✕</button>
      </div>

      <div class="settings-group">
        <label for="labNameInput">Lab name</label>
        <input type="text" id="labNameInput" value="SUBJECT 001" placeholder="Enter lab title">
      </div>

      <div class="settings-group">
        <label for="accentColorInput">Accent color</label>
        <input type="color" id="accentColorInput" value="#ffffff">
      </div>

      <div class="settings-group">
        <label for="accentFontSelect">Accent font</label>
        <select id="accentFontSelect">
          <option value="'Inter', system-ui, sans-serif">Inter (default)</option>
          <option value="'Courier New', monospace">Courier New</option>
          <option value="'Arial Black', 'Arial Bold', sans-serif">Arial Black</option>
          <option value="'Georgia', serif">Georgia</option>
          <option value="'Times New Roman', serif">Times New Roman</option>
          <option value="'Trebuchet MS', sans-serif">Trebuchet MS</option>
          <option value="'Verdana', sans-serif">Verdana</option>
          <option value="'Impact', sans-serif">Impact</option>
        </select>
      </div>

      <div class="settings-group">
        <label for="quoteInput">Landing quote</label>
        <input type="text" id="quoteInput" value="“The self is the only laboratory that matters.”" placeholder="Enter a quote">
      </div>

      <div class="settings-actions">
        <button class="lab-btn" id="applySettingsBtn">Apply</button>
        <button class="lab-btn secondary" id="resetSettingsBtn">Reset</button>
      </div>
    </div>

    <div class="lab-footer">LAB · SUBJECT 001 · v0.1</div>
  </div>

  <script>
    (function() {
      const landing = document.getElementById('labLanding');
      const settingsPanel = document.getElementById('labSettings');
      const startBtn = document.getElementById('startBtn');
      const closeSettingsBtn = document.getElementById('closeSettingsBtn');
      const applySettingsBtn = document.getElementById('applySettingsBtn');
      const resetSettingsBtn = document.getElementById('resetSettingsBtn');

      const labTitle = document.getElementById('labTitle');
      const labQuote = document.getElementById('labQuote');
      const labNameInput = document.getElementById('labNameInput');
      const accentColorInput = document.getElementById('accentColorInput');
      const accentFontSelect = document.getElementById('accentFontSelect');
      const quoteInput = document.getElementById('quoteInput');

      function hexToRgb(hex) {
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? {
          r: parseInt(result[1], 16),
          g: parseInt(result[2], 16),
          b: parseInt(result[3], 16)
        } : null;
      }

      function setAccent(color) {
        document.documentElement.style.setProperty('--accent', color);
        const rgb = hexToRgb(color);
        if (rgb) {
          document.documentElement.style.setProperty('--accent-rgb', `${rgb.r}, ${rgb.g}, ${rgb.b}`);
          document.documentElement.style.setProperty('--accent-muted', `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.6)`);
          document.documentElement.style.setProperty('--accent-dim', `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.1)`);
          document.documentElement.style.setProperty('--accent-faint', `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.04)`);
        }
      }

      function setAccentFont(fontFamily) {
        document.documentElement.style.setProperty('--font-accent', fontFamily);
      }

      function setLabName(name) {
        labTitle.textContent = name.toUpperCase();
        labNameInput.value = name;
        const footer = document.querySelector('.lab-footer');
        if (footer) footer.textContent = `LAB · ${name.toUpperCase()} · v0.1`;
      }

      function setQuote(quote) {
        labQuote.textContent = quote;
        quoteInput.value = quote;
      }

      const STORAGE_KEY = 'lab_config_v1';

      function saveConfigToLocal(config) {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(config)); } catch (e) {}
      }

      function loadConfigFromLocal() {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          return stored ? JSON.parse(stored) : null;
        } catch (e) { return null; }
      }

      function applyConfig(config) {
        if (!config) return;
        if (config.labName) setLabName(config.labName);
        if (config.accentColor) {
          setAccent(config.accentColor);
          accentColorInput.value = config.accentColor;
        }
        if (config.accentFont) {
          setAccentFont(config.accentFont);
          accentFontSelect.value = config.accentFont;
        }
        if (config.quote) setQuote(config.quote);
      }

      const defaultConfig = {
        labName: 'SUBJECT 001',
        accentColor: '#ffffff',
        accentFont: "'Inter', system-ui, sans-serif",
        quote: '“The self is the only laboratory that matters.”'
      };

      (function init() {
        const stored = loadConfigFromLocal();
        if (stored) {
          applyConfig(stored);
        } else {
          setLabName(defaultConfig.labName);
          setAccent(defaultConfig.accentColor);
          setAccentFont(defaultConfig.accentFont);
          setQuote(defaultConfig.quote);
          accentColorInput.value = defaultConfig.accentColor;
          accentFontSelect.value = defaultConfig.accentFont;
          saveConfigToLocal(defaultConfig);
        }
        labTitle.textContent = labTitle.textContent.toUpperCase();
      })();

      startBtn.addEventListener('click', () => {
        landing.classList.add('hidden');
        settingsPanel.style.display = 'flex';
      });

      closeSettingsBtn.addEventListener('click', () => {
        settingsPanel.style.display = 'none';
        landing.classList.remove('hidden');
      });

      applySettingsBtn.addEventListener('click', () => {
        const newName = labNameInput.value.trim() || 'LAB';
        const newColor = accentColorInput.value;
        const newFont = accentFontSelect.value;
        const newQuote = quoteInput.value.trim() || '“The self is the only laboratory that matters.”';

        setLabName(newName);
        setAccent(newColor);
        setAccentFont(newFont);
        setQuote(newQuote);

        saveConfigToLocal({
          labName: newName,
          accentColor: newColor,
          accentFont: newFont,
          quote: newQuote
        });

        settingsPanel.style.display = 'none';
        landing.classList.remove('hidden');
      });

      resetSettingsBtn.addEventListener('click', () => {
        labNameInput.value = defaultConfig.labName;
        accentColorInput.value = defaultConfig.accentColor;
        accentFontSelect.value = defaultConfig.accentFont;
        quoteInput.value = defaultConfig.quote;

        setLabName(defaultConfig.labName);
        setAccent(defaultConfig.accentColor);
        setAccentFont(defaultConfig.accentFont);
        setQuote(defaultConfig.quote);

        saveConfigToLocal(defaultConfig);
      });

      console.log('Lab ready — Subject 001');
    })();
  </script>
</body>
</html>
