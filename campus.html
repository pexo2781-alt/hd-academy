<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HDA — Campus</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav id="nav"></nav>

  <div class="campus-container">
    <div class="campus-title">
      <h1>H D A</h1>
      <h2>CAMPUS</h2>
      <div class="campus-stats">
        <div class="campus-stat">
          <div class="label">Class Points</div>
          <div class="value" id="statCP">—</div>
        </div>
        <div class="campus-stat">
          <div class="label">Personal Points</div>
          <div class="value" id="statPP">—</div>
        </div>
        <div class="campus-stat">
          <div class="label">Day</div>
          <div class="value" id="statDay">—</div>
        </div>
      </div>
    </div>

    <div class="building-grid">
      <div class="building" data-href="classroom.html">
        <div class="building-icon">📚</div>
        <div class="building-name">Classroom</div>
        <div class="building-hint">Take a lesson</div>
      </div>
      <div class="building" data-href="dorm.html">
        <div class="building-icon">🏠</div>
        <div class="building-name">Dorm</div>
        <div class="building-hint">Your profile</div>
      </div>
      <div class="building locked">
        <div class="building-icon">🔒</div>
        <div class="building-name">Exam Hall</div>
        <div class="building-hint">Phase 3</div>
      </div>
      <div class="building locked">
        <div class="building-icon">🔒</div>
        <div class="building-name">White Room</div>
        <div class="building-hint">Phase 3</div>
      </div>
      <div class="building locked">
        <div class="building-icon">🔒</div>
        <div class="building-name">Shop</div>
        <div class="building-hint">Phase 3</div>
      </div>
      <div class="building locked">
        <div class="building-icon">🔒</div>
        <div class="building-name">Cafeteria</div>
        <div class="building-hint">Phase 3</div>
      </div>
    </div>

    <p class="text-center mt-2" style="color:var(--anhs-grey); font-size:0.85rem; font-style:italic;">
      More facilities open as you progress.
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/state.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/slot-manager.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/campus.js"></script>
</body>
</html>
