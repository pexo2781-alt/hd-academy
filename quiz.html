<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ANHS — Quiz Arena</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav id="nav"></nav>

  <div class="container">
    <h1>Quiz Arena</h1>
    <p class="subtitle">Answer fast. Answer right. Climb the hierarchy.</p>

    <div id="subjectSelect" class="card text-center">
      <h2>Select Subject</h2>
      <div class="mt-1">
        <button class="btn" onclick="startQuiz('math')" style="margin:0.25rem;">Math</button>
        <button class="btn" onclick="startQuiz('science')" style="margin:0.25rem;">Science</button>
        <button class="btn" onclick="startQuiz('english')" style="margin:0.25rem;">English</button>
      </div>
    </div>

    <div id="quizScreen" class="card hidden">
      <div class="quiz-header">
        <span id="quizProgress" style="color:var(--anhs-grey);"></span>
        <span id="timer" class="timer">15s</span>
      </div>
      <div class="quiz-header">
        <span>Score: <strong id="scoreDisplay">0</strong></span>
        <span>Streak: <strong id="streakDisplay">0</strong></span>
      </div>
      <div id="questionText" class="question-text"></div>
      <div id="answers" class="answers"></div>
      <div id="scoreboard" class="scoreboard"></div>
    </div>

    <div id="resultScreen" class="hidden"></div>
  </div>

  <script src="js/state.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/ai-students.js"></script>
  <script src="js/ranking.js"></script>
  <script src="js/quiz-engine.js"></script>
  <script>
    renderNav("quiz");
    const params = new URLSearchParams(location.search);
    const preSubject = params.get("subject");

    function startQuiz(subject) {
      document.getElementById("subjectSelect").classList.add("hidden");
      document.getElementById("quizScreen").classList.remove("hidden");
      QuizEngine.start(subject);
    }

    if (preSubject && window.QUESTIONS[preSubject]) {
      startQuiz(preSubject);
    }
  </script>
</body>
</html>
