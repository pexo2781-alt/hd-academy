<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HDA — Settings</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav id="nav"></nav>
  <div class="container">
    <h1>Settings</h1>
    <p class="subtitle">Customize the site. Turn on Admin for full control.</p>

    <div class="card" style="border-left-color:${"var(--anhs-red)"};">
      <label style="display:flex; align-items:center; gap:0.75rem; cursor:pointer; font-weight:600;">
        <input type="checkbox" id="adminToggle" style="width:auto; transform:scale(1.4);">
        <span>Admin Mode — unlock raw JSON editors for every system</span>
      </label>
    </div>

    <div id="basicSettings"></div>
    <div id="adminSettings" class="hidden"></div>

    <div class="card text-center">
      <button class="btn" id="saveSettings">Save Settings</button>
      <button class="btn btn-secondary" id="resetSettings">Reset All</button>
      <div id="statusMsg" style="margin-top:0.75rem; font-weight:700;"></div>
    </div>

    <div class="text-center mt-2">
      <a href="index.html" class="btn btn-secondary">Back to Dashboard</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/state.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/nav.js"></script>
  <script>
    renderNav("settings");
  </script>
  <script src="js/settings.js"></script>
</body>
</html>
