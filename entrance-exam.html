<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HDA — Entrance Examination</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="container" style="max-width: 700px; margin-top: 2rem;">
    <!-- Exam screen -->
    <div id="examScreen" class="card">
      <div class="text-center mb-1" style="margin-bottom:1rem;">
        <h2 style="letter-spacing:0.2em; font-size:1rem; color:var(--anhs-grey);">ENTRANCE EXAMINATION</h2>
      </div>
      <div class="quiz-header">
        <span id="qProgress" style="color:var(--anhs-grey);">Question 1 of 15</span>
        <span id="timer" class="timer">45s</span>
      </div>
      <div style="font-size:0.85rem; color:var(--anhs-grey); text-transform:uppercase; letter-spacing:1px;" id="qSubject">—</div>
      <div id="qText" class="question-text"></div>
      <div id="qBody" class="answers" style="display:block;"></div>
      <div id="progressDots" class="progress-dots"></div>
    </div>

    <!-- Result screen -->
    <div id="resultScreen" class="hidden"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/state.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/slot-manager.js"></script>
  <script src="js/sorting.js"></script>
  <script src="js/entrance-exam.js"></script>
</body>
</html>
