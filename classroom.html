<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HDA — Classroom</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav id="nav"></nav>

  <div class="container">
    <h1>Classroom</h1>
    <p class="subtitle" id="classroomSubtitle">School Time · Day 0</p>

    <!-- Tab buttons -->
    <div class="tab-row">
      <button class="tab-btn active" data-tab="lessons" onclick="switchTab('lessons')">📚 Lessons</button>
      <button class="tab-btn" data-tab="classmates" onclick="switchTab('classmates')">👥 Classmates</button>
    </div>

    <!-- Lessons tab -->
    <div id="tab-lessons">
      <div id="subjectSelect" class="card text-center">
        <h2>Choose today's lesson</h2>
        <div class="mt-1">
          <button class="btn" onclick="startQuiz('math')" style="margin:0.25rem;">Mathematics</button>
          <button class="btn" onclick="startQuiz('science')" style="margin:0.25rem;">Science</button>
          <button class="btn" onclick="startQuiz('english')" style="margin:0.25rem;">English</button>
        </div>
        <div class="mt-2">
          <a href="campus.html" class="btn btn-secondary">← Return to Campus</a>
        </div>
      </div>

      <div id="quizScreen" class="card hidden">
        <div class="quiz-header">
          <span id="quizProgress" style="color:var(--anhs-grey);"></span>
          <span id="timer" class="timer">15s</span>
        </div>
        <div class="quiz-header">
          <span>Score: <strong id="scoreDisplay">0</strong></span>
          <span>Streak: <strong id="streakDisplay">0</strong></span>
        </div>
        <div id="questionText" class="question-text"></div>
        <div id="answers" class="answers"></div>
        <div id="scoreboard" class="scoreboard"></div>
      </div>

      <div id="resultScreen" class="hidden"></div>
    </div>

    <!-- Classmates tab -->
    <div id="tab-classmates" class="hidden">
      <div class="card">
        <h2 id="rosterTitle">Class D</h2>
        <p style="color:var(--anhs-grey); font-size:0.9rem; margin-bottom:1rem;">Click a classmate to talk.</p>
        <div id="rosterMount"></div>
      </div>
      <div class="text-center mt-2">
        <a href="campus.html" class="btn btn-secondary">← Return to Campus</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/state.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/slot-manager.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/ranking.js"></script>
  <script src="js/npc-data.js"></script>
  <script src="js/npc-generator.js"></script>
  <script src="js/npc-talk.js"></script>
  <script src="js/class-roster.js"></script>
  <script src="js/ai-students.js"></script>
  <script src="js/quiz-engine.js"></script>
  <script>
    window.renderNav("classroom");

    const slot = window.ANHS.getActiveSlotId();
    if (!slot) location.href = "slots.html";
    const st = window.ANHS.loadState();
    document.getElementById("classroomSubtitle").textContent = `School Time · Day ${st.day}`;

    // Populate roster
    document.getElementById("rosterTitle").textContent = "Class " + st.classRank;
    window.ClassRoster.renderRoster(document.getElementById("rosterMount"), st.classRank);

    function switchTab(tab) {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
      document.getElementById("tab-lessons").classList.toggle("hidden", tab !== "lessons");
      document.getElementById("tab-classmates").classList.toggle("hidden", tab !== "classmates");
    }

    function startQuiz(subject) {
      document.getElementById("subjectSelect").classList.add("hidden");
      document.getElementById("quizScreen").classList.remove("hidden");
      QuizEngine.start(subject);
    }
  </script>
</body>
</html>
