<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ANHS — Booklet</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav id="nav"></nav>
  <div class="container">
    <h1>Booklet</h1>
    <p class="subtitle">Puzzles test the mind. Choose your challenge.</p>

    <div class="card text-center">
      <h2>Select Puzzle Type</h2>
      <div class="mt-1">
        <button class="btn" onclick="Booklet.startFillblank()" style="margin:0.25rem;">Fill in the Blank</button>
        <button class="btn" onclick="Booklet.startMatching()" style="margin:0.25rem;">Matching</button>
        <button class="btn" onclick="Booklet.startLogic()" style="margin:0.25rem;">Logic Grid</button>
      </div>
    </div>

    <div id="puzzleArea" class="card hidden"></div>

    <div class="text-center mt-2">
      <a href="index.html" class="btn btn-secondary">Back to Dashboard</a>
    </div>
  </div>

  <script src="js/state.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/ranking.js"></script>
  <script src="js/booklet.js"></script>
  <script>
    renderNav("booklet");
    // Show puzzle area when starting
    ["startFillblank", "startMatching", "startLogic"].forEach(fn => {
      const orig = Booklet[fn];
      Booklet[fn] = function () {
        document.getElementById("puzzleArea").classList.remove("hidden");
        return orig.apply(Booklet, arguments);
      };
    });
  </script>
</body>
</html>
