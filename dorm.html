<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HDA — Dorm</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav id="nav"></nav>
  <div class="container" style="max-width: 600px;">
    <h1 class="text-center">Dorm</h1>
    <p class="subtitle text-center">Your room. Your record.</p>

    <div class="card text-center">
      <div id="portraitEmoji" class="portrait-preview">🎓</div>
      <div id="profileName" style="font-size:1.4rem; font-weight:700;">—</div>
      <div style="margin-top:0.4rem;">
        <span id="profileClass" class="class-badge class-D">Class D</span>
      </div>
      <div id="profileDay" style="color:var(--anhs-grey); font-size:0.9rem; margin-top:0.5rem;">Day 0</div>
    </div>

    <div class="card">
      <h3>Standings</h3>
      <div class="card-grid" style="margin-top:1rem;">
        <div class="stat-card"><div class="label">Class Points</div><div class="value" id="statCP">—</div></div>
        <div class="stat-card"><div class="label">Personal Points</div><div class="value" id="statPP">—</div></div>
        <div class="stat-card"><div class="label">Protection</div><div class="value" id="statProtection">—</div></div>
      </div>
    </div>

    <div class="card">
      <h3>Academic Record</h3>
      <div class="card-grid" style="margin-top:1rem;">
        <div class="stat-card"><div class="label">Quizzes</div><div class="value" id="statQuizzes">—</div></div>
        <div class="stat-card"><div class="label">Accuracy</div><div class="value" id="statAccuracy">—</div></div>
        <div class="stat-card"><div class="label">Best Streak</div><div class="value" id="statStreak">—</div></div>
      </div>
    </div>

    <div class="card text-center">
      <h3>Actions</h3>
      <div class="mt-1" style="display:flex; gap:0.5rem; flex-wrap:wrap; justify-content:center;">
        <a href="settings.html" class="btn btn-secondary">⚙ Settings</a>
        <a href="account.html" class="btn btn-secondary">☁ Account</a>
        <button class="btn btn-secondary" onclick="manualSave()">💾 Save</button>
        <button class="btn btn-secondary" id="resetBtn" style="border-color:var(--danger); color:var(--danger);">🗑 Delete Profile</button>
      </div>
    </div>

    <div class="text-center mt-2">
      <a href="campus.html" class="btn btn-secondary">← Back to Campus</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/state.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/slot-manager.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/dorm.js"></script>
  <script>
    function manualSave() {
      const st = window.ANHS.loadState();
      window.ANHS.saveState(st);
      alert("Saved.");
    }
  </script>
</body>
</html>
