<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ANHS — Special Exam</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav id="nav"></nav>
  <div class="container">
    <h1>Special Exam</h1>
    <p class="subtitle">Pass to gain CP. Fail, and the danger rises.</p>

    <div id="introCard" class="card text-center">
      <h2>Difficulty Assessment</h2>
      <p style="color:var(--anhs-grey); margin:1rem 0;">
        You will face <strong>10 mixed-subject questions</strong> with only <strong>10 seconds</strong> each.<br>
        You must answer <strong>7 or more</strong> correctly to pass.<br><br>
        <span style="color:var(--safe); font-weight:700;">PASS: +300 CP</span> &nbsp;·&nbsp;
        <span style="color:var(--danger); font-weight:700;">FAIL: −200 CP + 1 failed exam</span>
      </p>
      <button class="btn" onclick="startExam()">Begin Special Exam</button>
    </div>

    <div id="examScreen" class="card hidden">
      <div class="quiz-header">
        <span id="examProgress" style="color:var(--anhs-grey);"></span>
        <span id="examTimer" class="timer">10s</span>
      </div>
      <div class="quiz-header">
        <span>Correct: <strong id="examCorrect">0</strong></span>
      </div>
      <div id="examQuestion" class="question-text"></div>
      <div id="examAnswers" class="answers"></div>
    </div>

    <div id="examResult" class="hidden"></div>
  </div>

  <script src="js/config.js"></script> 
  <script src="js/state.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/ranking.js"></script>
  <script>
    renderNav("exam");

    const EXAM_TIME = window.CONFIG.gameplay.specialExamTimePerQuestion;
    const EXAM_QUESTIONS = window.CONFIG.gameplay.specialExamQuestionCount;
    const PASS_THRESHOLD = window.CONFIG.gameplay.specialExamPassThreshold;
    
    let exam = null;

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function startExam() {
      // Build 10 mixed questions
      const all = [];
      ["math", "science", "english"].forEach(sub => {
      (window.CONFIG.questions[sub] || []).forEach(q => all.push({ ...q, subject: sub }));
      });
      const picked = shuffle(all).slice(0, EXAM_QUESTIONS).map(q => {
        const indexed = q.a.map((text, i) => ({ text, isCorrect: i === q.c }));
        const shuffled = shuffle(indexed);
        return {
          q: q.q,
          options: shuffled.map(o => o.text),
          correctIdx: shuffled.findIndex(o => o.isCorrect)
        };
      });

      exam = { questions: picked, idx: 0, correct: 0, timer: null, timeLeft: EXAM_TIME, answered: false };
      document.getElementById("introCard").classList.add("hidden");
      document.getElementById("examScreen").classList.remove("hidden");
      renderExamQuestion();
    }

    function renderExamQuestion() {
      const q = exam.questions[exam.idx];
      exam.answered = false;
      exam.timeLeft = EXAM_TIME;

      document.getElementById("examProgress").textContent = `Question ${exam.idx + 1} / ${exam.questions.length}`;
      document.getElementById("examCorrect").textContent = exam.correct;
      document.getElementById("examQuestion").textContent = q.q;

      const answersDiv = document.getElementById("examAnswers");
      answersDiv.innerHTML = "";
      q.options.forEach((opt, i) => {
        const btn = document.createElement("button");
        btn.className = "answer-btn";
        btn.textContent = opt;
        btn.onclick = () => examAnswer(i);
        answersDiv.appendChild(btn);
      });

      startExamTimer();
    }

    function startExamTimer() {
      clearInterval(exam.timer);
      const el = document.getElementById("examTimer");
      el.textContent = exam.timeLeft + "s";
      el.classList.remove("warning");

      exam.timer = setInterval(() => {
        exam.timeLeft--;
        el.textContent = exam.timeLeft + "s";
        if (exam.timeLeft <= 3) el.classList.add("warning");
        if (exam.timeLeft <= 0) {
          clearInterval(exam.timer);
          if (!exam.answered) examAnswer(-1);
        }
      }, 1000);
    }

    function examAnswer(idx) {
      if (exam.answered) return;
      exam.answered = true;
      clearInterval(exam.timer);
      const q = exam.questions[exam.idx];
      const btns = document.querySelectorAll("#examAnswers .answer-btn");
      btns.forEach(b => b.disabled = true);

      if (idx === q.correctIdx) {
        btns[idx].classList.add("correct");
        exam.correct++;
      } else {
        if (idx >= 0) btns[idx].classList.add("wrong");
        btns[q.correctIdx].classList.add("correct");
      }
      document.getElementById("examCorrect").textContent = exam.correct;

      setTimeout(() => {
        exam.idx++;
        if (exam.idx >= exam.questions.length) {
          finishExam();
        } else {
          renderExamQuestion();
        }
      }, 1200);
    }

    function finishExam() {
      clearInterval(exam.timer);
      const st = window.ANHS.loadState();
      const passed = exam.correct >= PASS_THRESHOLD;
      const events = passed ? Ranking.passSpecialExam(st) : Ranking.failSpecialExam(st);
      window.ANHS.saveState(st);

      document.getElementById("examScreen").classList.add("hidden");
      const res = document.getElementById("examResult");
      res.classList.remove("hidden");

      if (st.expelled) {
        res.innerHTML = `
          <div class="result-box">
            <h1 style="color:var(--danger);">EXPELLED</h1>
            <p class="subtitle">Special Exam failure — you have been removed from ANHS.</p>
            <button class="btn" onclick="ANHS.resetState(); location.reload();">Appeal (Reset)</button>
          </div>`;
        return;
      }

      const eventsHtml = events.length
        ? `<div class="card mt-1" style="border-left-color:${passed ? 'var(--safe)' : 'var(--danger)'};">
             ${events.map(e => `<div style="padding:0.25rem 0;">${e.message}</div>`).join("")}
           </div>`
        : "";

      res.innerHTML = `
        <div class="result-box">
          <h1 style="color:${passed ? 'var(--safe)' : 'var(--danger)'};">${passed ? 'PASSED' : 'FAILED'}</h1>
          <div class="result-score">${exam.correct} / ${exam.questions.length}</div>
          <div class="result-detail">${passed ? '+300 CP' : '−200 CP · Failed exam count: ' + st.specialExamsFailed}</div>
        </div>
        ${eventsHtml}
        <div class="mt-2 text-center">
          <a href="index.html" class="btn">Back to Dashboard</a>
          <button class="btn btn-secondary" onclick="location.reload()">Retry Exam</button>
        </div>`;
    }
  </script>
</body>
</html>
